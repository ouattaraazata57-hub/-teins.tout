<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Éteins tout</title>
<style>
body{margin:0;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#1a1a2e;color:#fff;font-family:sans-serif}
h1{margin:0 0 8px}
#info{margin-bottom:12px;font-size:18px}
#grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;width:min(90vw,380px)}
.c{aspect-ratio:1;border:none;border-radius:12px;background:#2a2a44;cursor:pointer}
.c.on{background:#ffd93d;box-shadow:0 0 16px #ffd93d}
button.n{margin-top:16px;padding:12px 24px;font-size:18px;border:none;border-radius:10px;background:#6c63ff;color:#fff}
</style>
</head>
<body>
<h1>Éteins tout</h1>
<div id="info"></div>
<div id="grid"></div>
<button class="n" onclick="start()">Nouvelle partie</button>
<script>
const N=5;let g,moves,level=1;
function press(i,j){[[0,0],[1,0],[-1,0],[0,1],[0,-1]].forEach(([a,b])=>{const x=i+a,y=j+b;if(x>=0&&x<N&&y>=0&&y<N)g[x][y]=!g[x][y]})}
function start(){g=Array.from({length:N},()=>Array(N).fill(false));moves=0;
let k=2+level;while(k--)press(Math.floor(Math.random()*N),Math.floor(Math.random()*N));
if(g.every(r=>r.every(v=>!v)))press(2,2);draw()}
function draw(){const el=document.getElementById('grid');el.innerHTML='';
g.forEach((r,i)=>r.forEach((v,j)=>{const b=document.createElement('button');b.className='c'+(v?' on':'');b.onclick=()=>{press(i,j);moves++;draw();check()};el.appendChild(b)}));
document.getElementById('info').textContent='Niveau '+level+' • Coups : '+moves}
function check(){if(g.every(r=>r.every(v=>!v))){setTimeout(()=>{alert('Bravo ! Niveau '+level+' réussi en '+moves+' coups');level++;start()},100)}}
start();
</script>
</body>
</html>
